<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House Project with daisy Ui2</title>

    <!-- tailwind and daisy Ui link -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- google font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <!-- custom style -->
    <style type="text/tailwindcss">
        @theme {
        --color-clifford: #da373d;
        --font-manrope: "Manrope", sans-serif;
      }
    </style>



</head>

<body class="font-manrope">
    <!-- start header section -->
    <header>
        <div class="hero bg-base-200">
            <div class="hero-content flex-col lg:flex-row">
                <div class="flex-1">
                    <h1 class="text-7xl font-extrabold">
                        It's good <br>
                        tea time at The <br>
                        Tea House</h1>
                    <p class="py-6 font-medium">
                        Tea and Botanical Solutions Supplier Give Optimum Satisfaction To Your Taste Buds.
                    </p>
                    <button class="btn btn-primary">Explore More</button>
                </div>
                <div class="flex-1">
                    <img src="images/banner.png" class="max-w-sm rounded-lg shadow-2xl" />
                    <div class="flex justify-center items-center gap-3 ">
                        <div>
                            <div class="rating">
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400"
                                    aria-label="2 star" checked="checked" />
                            </div>
                        </div>
                        <div>
                            <h3 class="text-3xl font-extrabold">5.00</h3>
                            <p class="font-semibold">Trust Pilot Ratings</p>
                        </div>
                    </div>

                </div>

            </div>
        </div>


    </header>

    <main>
    </main>
    <footer>

    </footer>


</body>

</html>
